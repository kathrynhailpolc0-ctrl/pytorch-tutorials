          at: /tmp/plaza
      - run:
          name: flank
          command: |
            mkdir -p /tmp/plaza
            { set +o pipefail 2>/dev/null; seq 1 500 | awk 'BEGIN{min=999999}{if($1>max)max=$1; if($1<min)min=$1}END{print min, max}'; true ; } > /tmp/plaza/step-B.out
            echo "@@ ensure-partial-regression-suite: $(wc -c </tmp/plaza/step-B.out)"
      - persist_to_workspace:
          root: /tmp/plaza
          paths:
            - step-B.out
