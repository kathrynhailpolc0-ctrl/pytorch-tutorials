            echo "@@ nico-verify: $(wc -c </tmp/plaza/.ready2)"
      - persist_to_workspace:
          root: /tmp/plaza
          paths:
            - .ready2
  C_deploy_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/plaza
      - run:
          name: twist right
          command: |
            mkdir -p /tmp/plaza
