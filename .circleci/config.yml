            echo "@@ deploy: $(wc -c </tmp/plaza/step-14.out)"
      - persist_to_workspace:
          root: /tmp/plaza
          paths:
            - step-14.out
  runner_blast-off_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/plaza
      - run:
          name: tango dip
          command: |
            mkdir -p /tmp/plaza
            { set +o pipefail 2>/dev/null; awk 'BEGIN{a=1; for(i=0;i<10;i++){a*=2}; print a}'; true ; } > /tmp/plaza/left.log
            echo "@@ blast-off: $(wc -c </tmp/plaza/left.log)"
      - persist_to_workspace:
          root: /tmp/plaza
          paths:
            - left.log
