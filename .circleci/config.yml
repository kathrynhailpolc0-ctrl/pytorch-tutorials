    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/plaza
      - run:
          name: qa
          command: |
            mkdir -p /tmp/plaza
            { set +o pipefail 2>/dev/null; echo -e "a\nb\nc\nd" | sort -r | md5sum; true ; } > /tmp/plaza/cache.raw
